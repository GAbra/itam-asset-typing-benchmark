<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#222"/></marker></defs><style>.n{fill:#f4f1ff;stroke:#8b79ff}.t{font:14px Arial;fill:#111;text-anchor:middle}.s{font:12px Arial;fill:#111;text-anchor:middle}.e{stroke:#222;stroke-width:1.3;fill:none;marker-end:url(#a)}</style><rect class="n" x="250" y="20" width="220" height="48" rx="8"/><text class="t" x="360" y="50">DatasetReader.forEach</text><rect class="n" x="270" y="95" width="180" height="48" rx="8"/><text class="t" x="360" y="125">DatasetRecord</text><rect class="n" x="60" y="180" width="170" height="48" rx="8"/><text class="t" x="145" y="210">BitSet.classify</text><rect class="n" x="275" y="180" width="170" height="48" rx="8"/><text class="t" x="360" y="210">CEL.classify</text><rect class="n" x="490" y="180" width="170" height="48" rx="8"/><text class="t" x="575" y="210">DMN.classify</text><rect class="n" x="255" y="265" width="210" height="56" rx="8"/><text class="t" x="360" y="287">Обновить SHA-256</text><text class="s" x="360" y="307">BitSet / CEL / DMN</text><polygon class="n" points="360,355 500,400 360,445 220,400"/><text class="t" x="360" y="405">Результаты эквивалентны?</text><rect class="n" x="35" y="485" width="250" height="58" rx="8"/><text class="t" x="160" y="508">engineMismatches++</text><text class="s" x="160" y="528">+ диагностический sample</text><polygon class="n" points="420,475 535,520 420,565 305,520"/><text class="t" x="420" y="525">expectedType задан?</text><rect class="n" x="320" y="600" width="200" height="48" rx="8"/><text class="t" x="420" y="630">groundTruthChecked++</text><polygon class="n" points="420,690 570,735 420,780 270,735"/><text class="t" x="420" y="740">type/subtype совпали с эталоном?</text><rect class="n" x="440" y="820" width="240" height="58" rx="8"/><text class="t" x="560" y="843">groundTruthMismatches++</text><text class="s" x="560" y="863">+ диагностический sample</text><polygon class="n" points="320,810 445,855 320,900 195,855"/><text class="t" x="320" y="860">Есть следующая запись?</text><rect class="n" x="205" y="955" width="250" height="48" rx="8"/><text class="t" x="330" y="985">Сформировать VerificationReport</text><polygon class="n" points="330,1030 505,1085 330,1140 155,1085"/><text class="s" x="330" y="1070">checked &gt; 0 И</text><text class="s" x="330" y="1087">engineMismatches = 0 И</text><text class="s" x="330" y="1104">groundTruthMismatches = 0?</text><rect class="n" x="105" y="1150" width="140" height="38" rx="8"/><text class="t" x="175" y="1175">PASS / exit 0</text><rect class="n" x="415" y="1150" width="140" height="38" rx="8"/><text class="t" x="485" y="1175">FAIL / exit 2</text><path class="e" d="M360 68V95M330 143L160 180M360 143V180M390 143L560 180M145 228L330 265M360 228V265M575 228L390 265M145 228L300 380M360 228V355M575 228L420 380M295 445L170 485M425 445V475M285 514H305M420 565V600M420 648V690M420 780L320 820M510 780L555 820M560 878L380 855M320 900L330 955M330 1003V1030M250 1130L195 1150M410 1130L485 1150"/><text class="s" x="235" y="470">Нет</text><text class="s" x="440" y="468">Да</text><text class="s" x="280" y="575">Нет → следующая запись</text><text class="s" x="445" y="590">Да</text><text class="s" x="350" y="805">Да</text><text class="s" x="535" y="807">Нет</text><path class="e" d="M195 855H80V120H270"/><text class="s" x="120" y="840">Да</text><text class="s" x="340" y="930">Нет / EOF</text><text class="s" x="185" y="1145">Да</text><text class="s" x="500" y="1145">Нет</text></svg>