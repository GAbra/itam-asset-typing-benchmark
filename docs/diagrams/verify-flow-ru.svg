<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1340" viewBox="0 0 900 1340">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#222"/></marker>
  </defs>
  <style>
    .node{fill:#f4f1ff;stroke:#8b79ff;stroke-width:1.4}
    .decision{fill:#faf8ff;stroke:#8b79ff;stroke-width:1.4}
    .txt{font:15px Arial,sans-serif;fill:#111;text-anchor:middle}
    .small{font:13px Arial,sans-serif;fill:#111;text-anchor:middle}
    .edge{stroke:#222;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    .guide{stroke:#777;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
  </style>

  <rect class="node" x="330" y="25" width="240" height="50" rx="9"/><text class="txt" x="450" y="56">DatasetReader.forEach</text>
  <rect class="node" x="350" y="110" width="200" height="50" rx="9"/><text class="txt" x="450" y="141">DatasetRecord</text>

  <rect class="node" x="90" y="205" width="190" height="50" rx="9"/><text class="txt" x="185" y="236">BitSet.classify</text>
  <rect class="node" x="355" y="205" width="190" height="50" rx="9"/><text class="txt" x="450" y="236">CEL.classify</text>
  <rect class="node" x="620" y="205" width="190" height="50" rx="9"/><text class="txt" x="715" y="236">DMN.classify</text>

  <rect class="node" x="305" y="300" width="290" height="64" rx="9"/>
  <text class="txt" x="450" y="326">3 результата + обновить SHA-256</text><text class="small" x="450" y="348">BitSet / CEL / DMN</text>

  <polygon class="decision" points="450,405 595,455 450,505 305,455"/><text class="txt" x="450" y="461">Результаты эквивалентны?</text>

  <rect class="node" x="650" y="430" width="210" height="64" rx="9"/>
  <text class="txt" x="755" y="456">engineMismatches++</text><text class="small" x="755" y="478">+ diagnostic sample</text>

  <polygon class="decision" points="450,555 575,600 450,645 325,600"/><text class="txt" x="450" y="606">expectedType задан?</text>
  <rect class="node" x="335" y="690" width="230" height="50" rx="9"/><text class="txt" x="450" y="721">groundTruthChecked++</text>

  <polygon class="decision" points="450,790 610,840 450,890 290,840"/>
  <text class="txt" x="450" y="837">type/subtype совпали</text><text class="small" x="450" y="858">с эталоном?</text>

  <rect class="node" x="650" y="808" width="220" height="64" rx="9"/>
  <text class="txt" x="760" y="834">groundTruthMismatches++</text><text class="small" x="760" y="856">+ diagnostic sample</text>

  <polygon class="decision" points="450,950 580,995 450,1040 320,995"/><text class="txt" x="450" y="1001">Есть следующая запись?</text>

  <rect class="node" x="315" y="1090" width="270" height="50" rx="9"/><text class="txt" x="450" y="1121">Сформировать VerificationReport</text>

  <polygon class="decision" points="450,1175 640,1230 450,1285 260,1230"/>
  <text class="small" x="450" y="1212">checked &gt; 0 И</text><text class="small" x="450" y="1231">engineMismatches = 0 И</text><text class="small" x="450" y="1250">groundTruthMismatches = 0?</text>

  <rect class="node" x="210" y="1300" width="160" height="38" rx="8"/><text class="txt" x="290" y="1325">PASS / exit 0</text>
  <rect class="node" x="530" y="1300" width="160" height="38" rx="8"/><text class="txt" x="610" y="1325">FAIL / exit 2</text>

  <!-- основной поток -->
  <path class="edge" d="M450 75V110"/>
  <path class="edge" d="M450 160V185H185V205"/>
  <path class="edge" d="M450 160V205"/>
  <path class="edge" d="M450 160V185H715V205"/>
  <path class="edge" d="M185 255V280H450V300"/>
  <path class="edge" d="M450 255V300"/>
  <path class="edge" d="M715 255V280H450V300"/>
  <path class="edge" d="M450 364V405"/>

  <!-- equivalent: да прямо, нет через mismatch -->
  <path class="edge" d="M450 505V555"/><text class="small" x="470" y="535">Да</text>
  <path class="edge" d="M595 455H650"/><text class="small" x="620" y="444">Нет</text>
  <path class="edge" d="M755 494V525H575V600"/>

  <!-- expectedType -->
  <path class="edge" d="M450 645V690"/><text class="small" x="470" y="674">Да</text>
  <path class="edge" d="M325 600H145V995H320"/><text class="small" x="220" y="588">Нет → пропустить ground-truth check</text>
  <path class="edge" d="M450 740V790"/>

  <!-- ground truth -->
  <path class="edge" d="M450 890V950"/><text class="small" x="470" y="923">Да</text>
  <path class="edge" d="M610 840H650"/><text class="small" x="628" y="829">Нет</text>
  <path class="edge" d="M760 872V920H580V995"/>

  <!-- next record / EOF -->
  <path class="edge" d="M320 995H75V135H350"/><text class="small" x="110" y="982">Да → следующий DatasetRecord</text>
  <path class="edge" d="M450 1040V1090"/><text class="small" x="480" y="1070">Нет / EOF</text>
  <path class="edge" d="M450 1140V1175"/>
  <path class="edge" d="M355 1260V1288H290V1300"/><text class="small" x="315" y="1282">Да</text>
  <path class="edge" d="M545 1260V1288H610V1300"/><text class="small" x="585" y="1282">Нет</text>
</svg>
