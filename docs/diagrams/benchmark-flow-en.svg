<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1540" viewBox="0 0 900 1540">
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#222"/></marker></defs>
  <style>.node{fill:#f4f1ff;stroke:#8b79ff;stroke-width:1.4}.decision{fill:#faf8ff;stroke:#8b79ff;stroke-width:1.4}.txt{font:15px Arial,sans-serif;fill:#111;text-anchor:middle}.small{font:13px Arial,sans-serif;fill:#111;text-anchor:middle}.edge{stroke:#222;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>

  <rect class="node" x="350" y="20" width="200" height="46" rx="9"/><text class="txt" x="450" y="49">benchmark</text>
  <rect class="node" x="305" y="95" width="290" height="62" rx="9"/><text class="txt" x="450" y="119">DatasetReader.first</text><text class="small" x="450" y="141">min(max, batch, 5000)</text>
  <rect class="node" x="315" y="190" width="270" height="50" rx="9"/><text class="txt" x="450" y="221">Warmup × warmupIterations</text>
  <rect class="node" x="330" y="275" width="240" height="50" rx="9"/><text class="txt" x="450" y="306">Start measured run</text>
  <rect class="node" x="330" y="360" width="240" height="50" rx="9"/><text class="txt" x="450" y="391">DatasetReader.forEach</text>
  <rect class="node" x="305" y="445" width="290" height="50" rx="9"/><text class="txt" x="450" y="476">BatchAccumulator.accept</text>

  <polygon class="decision" points="450,535 565,580 450,625 335,580"/><text class="txt" x="450" y="586">seen &gt;= max?</text>
  <rect class="node" x="650" y="545" width="220" height="68" rx="9"/><text class="txt" x="760" y="571">Skip this record</text><text class="small" x="760" y="593">do not add it to batch</text>

  <rect class="node" x="325" y="665" width="250" height="58" rx="9"/><text class="txt" x="450" y="689">seen++ and add record</text><text class="small" x="450" y="710">to batch</text>
  <polygon class="decision" points="450,760 585,805 450,850 315,805"/><text class="txt" x="450" y="811">Is the batch full?</text>

  <rect class="node" x="260" y="885" width="380" height="124" rx="10"/>
  <text class="txt" x="450" y="911">flush(batch) — strictly sequential</text>
  <text class="small" x="450" y="936">1. HASHMAP_BITSET timer → classify + hash + XOR</text>
  <text class="small" x="450" y="958">2. CEL timer → classify + hash + XOR</text>
  <text class="small" x="450" y="980">3. DMN_KIE timer → classify + hash + XOR</text>
  <text class="small" x="450" y="1001">accumulate timing/checksum → clear batch</text>

  <polygon class="decision" points="450,1045 585,1090 450,1135 315,1090"/><text class="txt" x="450" y="1096">Another record?</text>
  <polygon class="decision" points="450,1180 565,1225 450,1270 335,1225"/><text class="txt" x="450" y="1231">Is the batch empty?</text>

  <rect class="node" x="625" y="1188" width="245" height="74" rx="9"/><text class="txt" x="748" y="1215">Final tail flush</text><text class="small" x="748" y="1238">same engine order</text><text class="small" x="748" y="1255">then clear batch</text>

  <rect class="node" x="330" y="1310" width="240" height="58" rx="9"/><text class="txt" x="450" y="1334">Create 3 RunResult</text><text class="small" x="450" y="1355">from MutableTiming</text>
  <polygon class="decision" points="450,1405 585,1450 450,1495 315,1450"/><text class="txt" x="450" y="1456">More measured runs?</text>

  <rect class="node" x="95" y="1417" width="175" height="66" rx="9"/><text class="txt" x="183" y="1442">median / min / max</text><text class="small" x="183" y="1465">per engine</text>
  <rect class="node" x="95" y="1500" width="175" height="38" rx="9"/><text class="txt" x="183" y="1525">BenchmarkReport</text>

  <path class="edge" d="M450 66V95M450 157V190M450 240V275M450 325V360M450 410V445M450 495V535"/>
  <path class="edge" d="M450 625V665"/><text class="small" x="470" y="648">No</text>
  <path class="edge" d="M450 723V760"/>
  <path class="edge" d="M450 850V885"/><text class="small" x="475" y="872">Yes → flush</text>
  <path class="edge" d="M450 1009V1045"/>

  <path class="edge" d="M565 580H650"/><text class="small" x="605" y="568">Yes</text>
  <path class="edge" d="M760 613V1090H585"/>

  <path class="edge" d="M315 805H180V1090H315"/><text class="small" x="235" y="793">No → no flush</text>
  <path class="edge" d="M315 1090H80V470H305"/><text class="small" x="135" y="1078">Yes → read next</text>

  <path class="edge" d="M450 1135V1180"/><text class="small" x="480" y="1164">No / EOF</text>
  <path class="edge" d="M450 1270V1310"/><text class="small" x="475" y="1294">Yes</text>
  <path class="edge" d="M565 1225H625"/><text class="small" x="595" y="1213">No</text>
  <path class="edge" d="M748 1262V1288H570V1339"/>

  <path class="edge" d="M450 1368V1405"/>
  <path class="edge" d="M585 1450H820V300H570"/><text class="small" x="665" y="1438">Yes → new measured run</text>
  <path class="edge" d="M315 1450H270"/><text class="small" x="292" y="1438">No</text>
  <path class="edge" d="M183 1483V1500"/>
</svg>
