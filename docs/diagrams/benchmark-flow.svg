<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1480" viewBox="0 0 960 1480">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#555"/></marker></defs>
<style>.b{fill:#f4f1ff;stroke:#8b79ff;stroke-width:1.5}.e{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#a)}.t{font:14px Arial,sans-serif;fill:#222}.s{font:12px Arial,sans-serif;fill:#444}</style>
<g id="boxes">
