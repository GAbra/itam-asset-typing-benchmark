<polygon class="b" points="210,830 340,875 210,920 80,875"/><text class="t" x="210" y="870" text-anchor="middle">batch.size &gt;= batchSize?</text>
<polygon class="b" points="690,520 820,565 690,610 560,565"/><text class="t" x="690" y="560" text-anchor="middle">batch empty?</text><text class="t" x="690" y="580" text-anchor="middle">batch пуст?</text>
<rect class="b" x="390" y="735" width="270" height="62" rx="10"/><text class="t" x="525" y="760" text-anchor="middle">Timer HASHMAP_BITSET</text><text class="t" x="525" y="782" text-anchor="middle">classify + resultHash + XOR</text>
<rect class="b" x="390" y="825" width="270" height="44" rx="10"/><text class="t" x="525" y="852" text-anchor="middle">accumulate elapsedNs / count / checksum</text>
<rect class="b" x="390" y="900" width="270" height="62" rx="10"/><text class="t" x="525" y="925" text-anchor="middle">Timer CEL</text><text class="t" x="525" y="947" text-anchor="middle">classify + resultHash + XOR</text>
<rect class="b" x="390" y="990" width="270" height="44" rx="10"/><text class="t" x="525" y="1017" text-anchor="middle">accumulate elapsedNs / count / checksum</text>
<rect class="b" x="390" y="1065" width="270" height="62" rx="10"/><text class="t" x="525" y="1090" text-anchor="middle">Timer DMN_KIE</text><text class="t" x="525" y="1112" text-anchor="middle">classify + resultHash + XOR</text>
<rect class="b" x="370" y="1155" width="310" height="62" rx="10"/><text class="t" x="525" y="1180" text-anchor="middle">accumulate timing</text><text class="t" x="525" y="1202" text-anchor="middle">clear batch → continue record loop</text>
<rect class="b" x="715" y="690" width="210" height="62" rx="10"/><text class="t" x="820" y="715" text-anchor="middle">Create 3 RunResult</text><text class="t" x="820" y="737" text-anchor="middle">from MutableTiming</text>
<polygon class="b" points="820,805 925,850 820,895 715,850"/><text class="t" x="820" y="845" text-anchor="middle">More measured runs?</text><text class="t" x="820" y="865" text-anchor="middle">Остались runs?</text>
<rect class="b" x="720" y="940" width="200" height="62" rx="10"/><text class="t" x="820" y="965" text-anchor="middle">median / min / max</text><text class="t" x="820" y="987" text-anchor="middle">per engine</text>
<rect class="b" x="735" y="1040" width="170" height="48" rx="10"/><text class="t" x="820" y="1070" text-anchor="middle">BenchmarkReport</text>
</g>
