<rect class="b" x="330" y="95" width="300" height="62" rx="10"/><text class="t" x="480" y="120" text-anchor="middle">DatasetReader.first</text><text class="t" x="480" y="142" text-anchor="middle">min(max, batch, 5000)</text>
