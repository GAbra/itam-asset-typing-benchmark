  <style>.node{fill:#f4f1ff;stroke:#8b79ff;stroke-width:1.4}.decision{fill:#faf8ff;stroke:#8b79ff;stroke-width:1.4}.txt{font:15px Arial,sans-serif;fill:#111;text-anchor:middle}.small{font:13px Arial,sans-serif;fill:#111;text-anchor:middle}.edge{stroke:#222;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
  <rect class="node" x="330" y="25" width="240" height="50" rx="9"/><text class="txt" x="450" y="56">DatasetReader.forEach</text>
  <rect class="node" x="350" y="110" width="200" height="50" rx="9"/><text class="txt" x="450" y="141">DatasetRecord</text>
