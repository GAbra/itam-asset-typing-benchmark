<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#222"/></marker></defs><style>.n{fill:#f4f1ff;stroke:#8b79ff}.t{font:14px Arial;fill:#111;text-anchor:middle}.s{font:12px Arial;fill:#111;text-anchor:middle}.e{stroke:#222;stroke-width:1.3;fill:none;marker-end:url(#a)}</style><rect class="n" x="250" y="20" width="220" height="48" rx="8"/><text class="t" x="360" y="50">DatasetReader.forEach</text><rect class="n" x="270" y="95" width="180" height="48" rx="8"/><text class="t" x="360" y="125">DatasetRecord</text><rect class="n" x="60" y="180" width="170" height="48" rx="8"/><text class="t" x="145" y="210">BitSet.classify</text><rect class="n" x="275" y="180" width="170" height="48" rx="8"/><text class="t" x="360" y="210">CEL.classify</text><rect class="n" x="490" y="180" width="170" height="48" rx="8"/><text class="t" x="575" y="210">DMN.classify</text><rect class="n" x="255" y="265" width="210" height="56" rx="8"/><text class="t" x="360" y="287">Update SHA-256</text><text class="s" x="360" y="307">BitSet / CEL / DMN</text><polygon class="n" points="360,355 485,400 360,445 235,400"/><text class="t" x="360" y="405">Equivalent?</text><rect class="n" x="40" y="485" width="245" height="58" rx="8"/><text class="t" x="162" y="508">engineMismatches++</text><text class="s" x="162" y="528">+ diagnostic sample</text><polygon class="n" points="420,475 535,520 420,565 305,520"/><text class="t" x="420" y="525">expectedType present?</text><rect class="n" x="320" y="600" width="200" height="48" rx="8"/><text class="t" x="420" y="630">groundTruthChecked++</text><polygon class="n" points="420,690 555,735 420,780 285,735"/><text class="t" x="420" y="740">type/subtype match label?</text><rect class="n" x="445" y="820" width="235" height="58" rx="8"/><text class="t" x="563" y="843">groundTruthMismatches++</text><text class="s" x="563" y="863">+ diagnostic sample</text><polygon class="n" points="320,810 430,855 320,900 210,855"/><text class="t" x="320" y="860">Another record?</text><rect class="n" x="220" y="955" width="220" height="48" rx="8"/><text class="t" x="330" y="985">Build VerificationReport</text><polygon class="n" points="330,1030 500,1085 330,1140 160,1085"/><text class="s" x="330" y="1070">checked &gt; 0 AND</text><text class="s" x="330" y="1087">engineMismatches = 0 AND</text><text class="s" x="330" y="1104">groundTruthMismatches = 0?</text><rect class="n" x="105" y="1150" width="140" height="38" rx="8"/><text class="t" x="175" y="1175">PASS / exit 0</text><rect class="n" x="415" y="1150" width="140" height="38" rx="8"/><text class="t" x="485" y="1175">FAIL / exit 2</text><path class="e" d="M360 68V95M330 143L160 180M360 143V180M390 143L560 180M145 228L330 265M360 228V265M575 228L390 265M145 228L300 380M360 228V355M575 228L420 380M300 445L170 485M420 445V475M285 514H305M420 565V600M420 648V690M420 780L320 820M500 780L555 820M563 878L380 855M320 900L330 955M330 1003V1030M250 1130L195 1150M410 1130L485 1150"/><text class="s" x="235" y="470">No</text><text class="s" x="437" y="468">Yes</text><text class="s" x="280" y="575">No → next record</text><text class="s" x="445" y="590">Yes</text><text class="s" x="350" y="805">Yes</text><text class="s" x="535" y="807">No</text><path class="e" d="M210 855H90V120H270"/><text class="s" x="125" y="840">Yes</text><text class="s" x="335" y="930">No / EOF</text><text class="s" x="185" y="1145">Yes</text><text class="s" x="500" y="1145">No</text></svg>