  <polygon class="decision" points="450,790 610,840 450,890 290,840"/><text class="txt" x="450" y="837">Do type/subtype</text><text class="small" x="450" y="858">match the label?</text>
  <rect class="node" x="650" y="808" width="220" height="64" rx="9"/><text class="txt" x="760" y="834">groundTruthMismatches++</text><text class="small" x="760" y="856">+ diagnostic sample</text>
  <polygon class="decision" points="450,950 580,995 450,1040 320,995"/><text class="txt" x="450" y="1001">Another record?</text>
  <rect class="node" x="315" y="1090" width="270" height="50" rx="9"/><text class="txt" x="450" y="1121">Build VerificationReport</text>
  <polygon class="decision" points="450,1175 640,1230 450,1285 260,1230"/><text class="small" x="450" y="1212">checked &gt; 0 AND</text><text class="small" x="450" y="1231">engineMismatches = 0 AND</text><text class="small" x="450" y="1250">groundTruthMismatches = 0?</text>
