name: software-taxonomy-v3-smoke

on:
  pull_request:
    paths:
      - 'src/main/java/ru/itam/typing/**'
      - 'src/test/java/ru/itam/typing/**'
      - 'data/software-catalog-v3.yaml'
      - 'rules/software-taxonomy-v3.yaml'
      - 'scripts/run-software-taxonomy-v3.sh'
      - 'scripts/run-software-taxonomy-v3-docker.sh'
      - 'scripts/summarize-software-taxonomy-v3.py'
      - 'docs/SOFTWARE_TAXONOMY_V3.md'
      - 'docs/SOFTWARE_TAXONOMY_V3_RU.md'
      - 'Dockerfile'
      - '.github/workflows/software-taxonomy-v3-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-taxonomy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Execute software taxonomy v3 Docker orchestration with smoke sizes
        env:
          SOFTWARE_COUNT: '5000'
          SEED: '20260916'
          CONFLICT_WINDOW: '80'
          STRICT_GATE: '0'
          OUT_DIR: 'results/software-taxonomy-v3/ci-orchestration-smoke'
        run: sh scripts/run-software-taxonomy-v3-docker.sh
      - name: Assert expected artifacts
        run: |
          test -f results/software-taxonomy-v3/ci-orchestration-smoke/SHA256SUMS.txt
          test -f results/software-taxonomy-v3/ci-orchestration-smoke/software-taxonomy-summary.json
          test -f results/software-taxonomy-v3/ci-orchestration-smoke/cases/clean/accuracy.json
          test -f results/software-taxonomy-v3/ci-orchestration-smoke/cases/stress/accuracy.json
          test -f results/software-taxonomy-v3/ci-orchestration-smoke/cases/severe/generation.json
          python3 scripts/summarize-software-taxonomy-v3.py results/software-taxonomy-v3/ci-orchestration-smoke --window 80
