name: research-v2-smoke

on:
  pull_request:
    paths:
      - 'src/main/java/ru/itam/typing/**'
      - 'src/jmh/java/**'
      - 'src/test/java/ru/itam/typing/**'
      - 'rules/**'
      - 'Dockerfile'
      - 'scripts/run-research-v2.sh'
      - 'scripts/run-research-v2-docker.sh'
      - 'scripts/validate-research-v2.py'
      - 'pom.xml'
      - '.github/workflows/research-v2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-runner-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Execute complete realistic-v2 Docker orchestration with smoke sizes
        env:
          ACCURACY_COUNT: '200'
          DISTRIBUTION_COUNT: '100'
          PERF_COUNT: '200'
          SEED: '20260910'
          WARMUP: '0'
          RUNS: '3'
          BATCH: '50'
          RUN_JMH: '0'
          OUT_DIR: 'results/research-v2/ci-orchestration-smoke'
        run: sh scripts/run-research-v2-docker.sh
      - name: Assert expected artifacts
        run: |
          test -f results/research-v2/ci-orchestration-smoke/SHA256SUMS.txt
          test -f results/research-v2/ci-orchestration-smoke/accuracy/clean/accuracy.json
          test -f results/research-v2/ci-orchestration-smoke/accuracy/severe/accuracy.json
          test -f results/research-v2/ci-orchestration-smoke/distributions/device-heavy/accuracy.json
          test -f results/research-v2/ci-orchestration-smoke/distributions/identity-heavy/accuracy.json
          test -f results/research-v2/ci-orchestration-smoke/distributions/software-heavy/accuracy.json
          test -f results/research-v2/ci-orchestration-smoke/performance/benchmark-14.json
          test -f results/research-v2/ci-orchestration-smoke/performance/benchmark-50.json
          test -f results/research-v2/ci-orchestration-smoke/performance/benchmark-100.json
          test -f results/research-v2/ci-orchestration-smoke/performance/benchmark-500.json
          python3 scripts/validate-research-v2.py results/research-v2/ci-orchestration-smoke
