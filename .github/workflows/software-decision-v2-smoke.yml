name: software-decision-v2-smoke

on:
  pull_request:
    paths:
      - 'src/main/java/ru/itam/typing/**'
      - 'src/test/java/ru/itam/typing/**'
      - 'rules/software-conservative-v2.yaml'
      - 'Dockerfile'
      - 'scripts/run-software-decision-v2.sh'
      - 'scripts/run-software-decision-v2-docker.sh'
      - 'scripts/summarize-software-decision-v2.py'
      - '.github/workflows/software-decision-v2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-decision-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Execute software decision Docker orchestration with smoke sizes
        env:
          SOFTWARE_COUNT: '1000'
          SEED: '20260915'
          CONFLICT_WINDOW: '80'
          STRICT_GATE: '0'
          OUT_DIR: 'results/software-decision-v2/ci-orchestration-smoke'
        run: sh scripts/run-software-decision-v2-docker.sh
      - name: Assert expected artifacts
        run: |
          test -f results/software-decision-v2/ci-orchestration-smoke/SHA256SUMS.txt
          test -f results/software-decision-v2/ci-orchestration-smoke/software-decision-summary.json
          test -f results/software-decision-v2/ci-orchestration-smoke/cases/control/baseline.json
          test -f results/software-decision-v2/ci-orchestration-smoke/cases/control/candidate.json
          test -f results/software-decision-v2/ci-orchestration-smoke/cases/software-stress/baseline.json
          test -f results/software-decision-v2/ci-orchestration-smoke/cases/software-stress/candidate.json
          python3 scripts/summarize-software-decision-v2.py results/software-decision-v2/ci-orchestration-smoke --window 80
