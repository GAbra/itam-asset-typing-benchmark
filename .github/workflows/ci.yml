name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-figures.txt
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
      - name: Build JMH research artifact
        run: mvn -B --no-transfer-progress -Pjmh -DskipTests package
      - name: Smoke-test JMH research benchmark
        run: |
          java -jar target/itam-asset-typing-benchmark-1.0.0-jmh.jar \
            'ru.itam.typing.bench.EngineJmhBenchmark.bitsetEngineOnly' \
            -p ruleCount=14 -wi 1 -i 1 -f 1 -w 100ms -r 100ms
      - name: Smoke-test realistic v2 holdout and accuracy path
        run: |
          java -cp target/itam-asset-typing-benchmark-1.0.0.jar ru.itam.typing.realistic.RealisticWorkloadCli all \
            --count 2000 --seed 20260910 --noise moderate --distribution device-heavy \
            --raw data/generated/ci-v2-raw.jsonl --truth data/generated/ci-v2-truth.jsonl \
            --out data/generated/ci-v2-normalized.jsonl
          java -cp target/itam-asset-typing-benchmark-1.0.0.jar ru.itam.typing.realistic.HoldoutSplitCli \
            --raw data/generated/ci-v2-raw.jsonl --truth data/generated/ci-v2-truth.jsonl \
            --train-raw data/generated/ci-v2-train-raw.jsonl --train-truth data/generated/ci-v2-train-truth.jsonl \
            --holdout-raw data/generated/ci-v2-holdout-raw.jsonl --holdout-truth data/generated/ci-v2-holdout-truth.jsonl \
            --out results/ci/v2-split.json
          java -cp target/itam-asset-typing-benchmark-1.0.0.jar ru.itam.typing.realistic.RealisticWorkloadCli materialize \
            --raw data/generated/ci-v2-holdout-raw.jsonl --truth data/generated/ci-v2-holdout-truth.jsonl \
            --out data/generated/ci-v2-holdout-normalized.jsonl
          java -cp target/itam-asset-typing-benchmark-1.0.0.jar ru.itam.typing.realistic.AccuracyEvaluationCli \
            --data data/generated/ci-v2-holdout-normalized.jsonl --truth data/generated/ci-v2-holdout-truth.jsonl \
            --out results/ci/v2-accuracy.json
          python -c 'import json; r=json.load(open("results/ci/v2-accuracy.json")); assert r["result"]=="OK" and r["engineDivergences"]==0 and r["total"]>0'
      - name: Verify archived reports and generated figures
        run: |
          python scripts/validate-results.py
          python -m pip install -r scripts/requirements-figures.txt
          python scripts/render-results.py --check
      - name: Check deterministic generation across JVM processes
        run: |
          java -jar target/itam-asset-typing-benchmark-1.0.0.jar generate --count 10000 --seed 20260909
          java -jar target/itam-asset-typing-benchmark-1.0.0.jar generate --count 10000 --seed 20260909 --out data/generated/repeated.jsonl
          cmp data/generated/normalized-10000.jsonl data/generated/repeated.jsonl
      - name: Verify 10000 assets and ground truth
        run: |
          java -jar target/itam-asset-typing-benchmark-1.0.0.jar verify --data data/generated/normalized-10000.jsonl --out results/ci/verify-10000.json
          python -c 'import json; r=json.load(open("results/ci/verify-10000.json")); assert r["result"]=="PASS" and r["checked"]==r["groundTruthChecked"]==10000; assert r["engineMismatches"]==r["groundTruthMismatches"]==0; assert r["hashBitset"]==r["hashCel"]==r["hashDmn"]'
      - name: Smoke-test benchmark report (no performance threshold)
        run: java -jar target/itam-asset-typing-benchmark-1.0.0.jar benchmark --data data/generated/normalized-10000.jsonl --warmup 1 --runs 1 --batch 2000 --out results/ci/benchmark-smoke.json
      - name: Validate scripts and Compose
        run: |
          for script in run-quick-demo.sh scripts/*.sh; do sh -n "$script"; done
          docker compose config --quiet
      - name: Build development and portable runtime images
        run: |
          docker compose build
          docker build -f Dockerfile.runtime -t itam-asset-typing-benchmark:prebuilt .
      - name: Verify packaged runtime without a source mount
        run: |
          docker run --rm itam-asset-typing-benchmark:prebuilt --help
          docker run --rm --entrypoint sh itam-asset-typing-benchmark:prebuilt -c 'java -jar /opt/itam/itam-asset-typing-benchmark.jar generate --count 10000 --out /tmp/data.jsonl && java -jar /opt/itam/itam-asset-typing-benchmark.jar verify --data /tmp/data.jsonl'
      - name: Package portable runtime and provenance
        if: github.event_name != 'pull_request'
        run: |
          docker save itam-asset-typing-benchmark:prebuilt -o itam-asset-typing-benchmark-prebuilt.tar
          sha256sum itam-asset-typing-benchmark-prebuilt.tar > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          docker image inspect itam-asset-typing-benchmark:prebuilt --format '{{.Id}}' > IMAGE_ID
      - name: Upload portable runtime
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: itam-asset-typing-benchmark-prebuilt
          path: |
            itam-asset-typing-benchmark-prebuilt.tar
            SHA256SUMS
            SOURCE_COMMIT
            IMAGE_ID
            target/itam-asset-typing-benchmark-1.0.0.jar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish versioned release and container
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          image=ghcr.io/gabra/itam-asset-typing-benchmark
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag itam-asset-typing-benchmark:prebuilt "$image:$GITHUB_REF_NAME"
          docker tag itam-asset-typing-benchmark:prebuilt "$image:latest"
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
          cp target/itam-asset-typing-benchmark-"$version".jar .
          sha256sum itam-asset-typing-benchmark-"$version".jar itam-asset-typing-benchmark-prebuilt.tar > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME — research baseline" --notes-file docs/RELEASE_NOTES.md --draft
          gh release upload "$GITHUB_REF_NAME" itam-asset-typing-benchmark-"$version".jar itam-asset-typing-benchmark-prebuilt.tar SHA256SUMS SOURCE_COMMIT IMAGE_ID
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Upload test and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            results/ci/
          retention-days: 14
