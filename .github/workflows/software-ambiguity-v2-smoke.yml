name: software-ambiguity-v2-smoke

on:
  pull_request:
    paths:
      - 'src/main/java/ru/itam/typing/**'
      - 'src/test/java/ru/itam/typing/**'
      - 'rules/**'
      - 'Dockerfile'
      - 'scripts/run-software-ambiguity-v2.sh'
      - 'scripts/run-software-ambiguity-v2-docker.sh'
      - 'scripts/summarize-software-ambiguity-v2.py'
      - '.github/workflows/software-ambiguity-v2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-ambiguity-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Execute software ambiguity Docker orchestration with smoke size
        env:
          SOFTWARE_COUNT: '2000'
          SEED: '20260914'
          CONFLICT_WINDOW: '80'
          STRICT_GATE: '1'
          OUT_DIR: 'results/software-ambiguity-v2/ci-orchestration-smoke'
        run: sh scripts/run-software-ambiguity-v2-docker.sh
      - name: Assert expected artifacts
        run: |
          test -f results/software-ambiguity-v2/ci-orchestration-smoke/SHA256SUMS.txt
          test -f results/software-ambiguity-v2/ci-orchestration-smoke/software-summary.json
          test -f results/software-ambiguity-v2/ci-orchestration-smoke/cases/control/accuracy.json
          test -f results/software-ambiguity-v2/ci-orchestration-smoke/cases/software-stress/accuracy.json
          test -f results/software-ambiguity-v2/ci-orchestration-smoke/cases/software-severe/injection.json
          test -f results/software-ambiguity-v2/ci-orchestration-smoke/cases/combined-stress/accuracy.json
