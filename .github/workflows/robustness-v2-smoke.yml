name: robustness-v2-smoke

on:
  pull_request:
    paths:
      - 'src/main/java/ru/itam/typing/**'
      - 'src/test/java/ru/itam/typing/**'
      - 'rules/**'
      - 'Dockerfile'
      - 'scripts/run-robustness-v2.sh'
      - 'scripts/run-robustness-v2-docker.sh'
      - 'scripts/compare-robustness-v2.py'
      - 'scripts/validate-robustness-v2.py'
      - 'docs/ROBUSTNESS_GATE_V2.md'
      - 'docs/ROBUSTNESS_GATE_V2_RU.md'
      - '.github/workflows/robustness-v2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness-runner-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Execute robustness Docker orchestration with smoke sizes
        env:
          ROBUSTNESS_COUNT: '500'
          DISTRIBUTION_COUNT: '250'
          SEED: '20260911'
          CONFLICT_WINDOW: '80'
          STRICT_GATE: '0'
          OUT_DIR: 'results/robustness-v2/ci-orchestration-smoke'
        run: sh scripts/run-robustness-v2-docker.sh
      - name: Assert expected artifacts
        run: |
          test -f results/robustness-v2/ci-orchestration-smoke/SHA256SUMS.txt
          test -f results/robustness-v2/ci-orchestration-smoke/robustness-summary.json
          test -f results/robustness-v2/ci-orchestration-smoke/accuracy/clean/baseline.json
          test -f results/robustness-v2/ci-orchestration-smoke/accuracy/clean/conservative.json
          test -f results/robustness-v2/ci-orchestration-smoke/accuracy/severe/baseline.json
          test -f results/robustness-v2/ci-orchestration-smoke/accuracy/severe/conservative.json
          test -f results/robustness-v2/ci-orchestration-smoke/distributions/device-heavy/conservative.json
          python3 scripts/validate-robustness-v2.py results/robustness-v2/ci-orchestration-smoke --window 80
