name: Bug report
description: Report a reproducibility, correctness or documentation problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commit, exact commands, expected and actual behavior. Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Java, OS, Docker versions and relevant reports or logs. Remove credentials and personal information.
